<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>五条真实 DeepSeek / DSH 轨迹</title>
<style>
:root{color-scheme:light;font-family:system-ui,sans-serif;color:#192b3c;background:#f4f6f8}body{margin:0}header,main{max-width:1480px;margin:auto;padding:24px}header{padding-bottom:8px}h1{font-size:28px;margin:0 0 10px}p{line-height:1.6}.muted{color:#617386;font-size:13px}nav{display:flex;gap:8px;flex-wrap:wrap}button,a.pill{border:1px solid #ccd6df;border-radius:8px;background:white;color:#184f6b;padding:9px 13px;cursor:pointer;text-decoration:none}button.active{background:#184f6b;color:white}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:20px 0}.card{background:white;border:1px solid #dde4eb;border-radius:12px;padding:14px}.card img{width:100%;height:340px;object-fit:contain;background:white}.card h3{margin:0 0 8px}a{color:#14618b}details{background:white;border:1px solid #dbe3e9;border-radius:8px;margin:9px 0;padding:11px}summary{cursor:pointer;font-size:14px;font-weight:600}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.65 ui-monospace,SFMono-Regular,monospace;max-height:65vh;overflow:auto;background:#f5f7fa;padding:14px;border-radius:6px}label{margin-right:16px}input{padding:9px;border:1px solid #ccd6df;border-radius:7px;min-width:230px}.error{color:#a32424}.tag{display:inline-block;background:#edf3f7;padding:3px 7px;border-radius:5px;margin:0 4px;font-size:12px}.images{display:flex;gap:10px;flex-wrap:wrap}.images img{max-width:240px;max-height:210px;object-fit:contain}#status{min-height:22px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}@media(max-width:850px){.cards{grid-template-columns:1fr}.card img{height:auto;max-height:460px}}
</style>
<header><h1>五条真实 DeepSeek / DSH 轨迹</h1><p class="muted">从已完成且通过完整性审计的案例中固定随机抽样。流程完整与 XML 可渲染，不代表画面已完全还原。下方内容来自实际 API 和工具日志；不补写模型推理。完整历史与图片留在远端，按需加载。</p><nav id="tabs"></nav></header>
<main><div id="status">正在加载样本…</div><section id="case"></section><h2>逐次调用</h2><p class="muted">每条对应一次真实 API 请求。展开可看完整的模型思考、文本答复、工具请求与实际返回；完整输入中的图片用原始图片链接呈现，原始 JSON 和 SSE 也可查看。Reviewer 回复作为观察保留，不作为 SFT 监督目标。</p><div class="bar"><label>角色 <select id="role"><option value="">全部</option><option>generator</option><option>reviewer</option></select></label><input id="search" placeholder="筛选调用号、阶段或角色"><span id="count" class="muted"></span></div><div id="timeline"></div></main>
<script>
const $=id=>document.getElementById(id);let manifest,selected,rows=[];
const node=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
const pretty=x=>JSON.stringify(x,null,2);
async function get(url){if(window.traceGet)return window.traceGet(url);const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(`${r.status}: ${url}`);return r.json()}
function link(text,url){const a=node('a',text);a.target='_blank';a.rel='noopener';if(window.traceLink)return window.traceLink(a,text,url);a.href=url;return a}
function section(title,content){const d=node('details');d.append(node('summary',title));const pre=node('pre',typeof content==='string'?content:pretty(content));d.append(pre);return d}
function collectImages(value,out=[]){if(value&&typeof value==='object'){if(value.image&&value.sha256)out.push(value);else Object.values(value).forEach(x=>collectImages(x,out))}return out}
function showError(error){$('status').textContent=String(error);$('status').className='error'}
async function openCall(row,details){if(details.dataset.loaded)return;details.dataset.loaded='true';const content=node('div','加载真实记录…');details.append(content);try{const p=await get(`/call/${row.id}`);content.textContent='';const message=p.response.choices?.[0]?.message||{};content.append(node('p',p.role==='reviewer'?'记录状态：独立 Reviewer 的观察，不作为监督目标。':(p.status!==200||p.error)?'记录状态：请求失败或中断，原始信息保留，不作监督目标。':p.supervision_eligible?'记录状态：未标记为传输中断。还原质量仍待确认。':'记录状态：回复未执行或工具结果未知，原始内容和证据保留，不作监督目标。','muted'));content.append(section('模型思考：reasoning_content（API 返回原文）',message.reasoning_content||'此请求未返回 reasoning_content。'));content.append(section('模型文本答复：content（完整原文）',message.content||'此请求无文本答复。'));content.append(section('工具请求与实际执行、返回（完整记录）',p.tool_execution));if(p.error)content.append(section('实际错误记录',p));const bar=node('p');bar.append(link('原始 SSE',`/wire/${row.id}`),document.createTextNode(' · '),link('原始完整请求 JSON（含图片，可能较大）',`/raw-request/${row.id}`));content.append(bar);const input=node('details');input.append(node('summary','完整输入：固定提示、工具定义、全部历史与图片（按需加载）'));input.addEventListener('toggle',async()=>{if(!input.open||input.dataset.loaded)return;input.dataset.loaded='true';const wait=node('p','正在从远端读取完整输入…','muted');input.append(wait);try{const request=await get(`/request/${row.id}`);wait.remove();const gallery=node('div',undefined,'images');collectImages(request).forEach(img=>{const a=link('',img.image);const image=node('img');image.src=img.image;image.loading='lazy';image.title=img.sha256;a.append(image);gallery.append(a)});input.append(gallery,node('pre',pretty(request)))}catch(e){wait.textContent=String(e)}});content.append(input,section('完整结构化 API 回复及来源哈希',p))}catch(e){content.textContent=String(e);content.className='error'}}
function renderRows(){const filter=$('role').value,query=$('search').value.toLowerCase();const visible=rows.filter(r=>(!filter||r.role===filter)&&`${r.id} ${r.role} ${r.stage}`.includes(query));$('timeline').textContent='';$('count').textContent=`${visible.length} / ${rows.length} 次调用`;for(const row of visible){const d=node('details');const summary=node('summary',`#${row.id} · ${row.role} · 第 ${row.stage} 轮 · HTTP ${row.status??'—'} · ¥${Number(row.cost_cny||0).toFixed(4)}`);if(row.error)summary.append(node('span',` ${row.error}`,'error'));d.append(summary);d.addEventListener('toggle',()=>{if(d.open)openCall(row,d)});$('timeline').append(d)}}
async function selectCase(c){selected=c;history.replaceState(null,'',`?case=${encodeURIComponent(c.id)}`);$('status').textContent=`${c.paper} · ${c.id} · ${c.generator_decisions} 次生成决策 · 费用估算 ¥${c.cost_cny.toFixed(2)} · 完整性审计通过 · 还原质量未认证`;$('status').className='';$('case').textContent='';document.querySelectorAll('#tabs button').forEach(b=>b.className=b.dataset.id===c.id?'active':'');const cards=node('div',undefined,'cards');for(const [name,title] of [['reference.png','原图（arXiv）'],['round1.png','第一轮实际渲染'],['round2.png','第二轮实际渲染']]){const card=node('div',undefined,'card');card.append(node('h3',title));const a=link('',`/case/${c.id}/${name}`),img=node('img');img.src=a.href;img.alt=title;a.append(img);card.append(a);cards.append(card)}$('case').append(cards);const bar=node('p');bar.append(link('论文来源',c.arxiv_url),document.createTextNode(' · '),link('第一轮 Draw.io',`/case/${c.id}/round1.drawio`),document.createTextNode(' · '),link('第二轮 Draw.io',`/case/${c.id}/round2.drawio`),document.createTextNode(' · '),link('Generator 原生事件日志',`/events/${c.id}/generator`),document.createTextNode(' · '),link('Reviewer 原生事件日志',`/events/${c.id}/reviewer`));$('case').append(bar,section('独立 Reviewer 的完整反馈',c.review),section('来源、抽样方式、配置与审计',c));$('timeline').textContent='正在加载调用列表…';rows=await get(`/calls/${c.id}`);renderRows()}
$('role').addEventListener('change',renderRows);$('search').addEventListener('input',renderRows);
get('/manifest').then(async m=>{manifest=m;for(const [i,c] of m.cases.entries()){const b=node('button',`${i+1} · ${c.paper}`);b.dataset.id=c.id;b.onclick=()=>selectCase(c).catch(showError);$('tabs').append(b)}const id=new URLSearchParams(location.search).get('case');await selectCase(m.cases.find(c=>c.id===id)||m.cases[0])}).catch(showError);
</script></html>
