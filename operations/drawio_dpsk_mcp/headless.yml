- id: credentials
  disabled: false
  config:
    path: /account.yml
    watch: false
- id: authorization
  disabled: false
- id: deepseek-account
  disabled: false
- id: agent-default-model
  config:
    provider: deepseek-account
    model: deepseek-flash
    reasoningEffort: max
- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: /case
- id: approval
  config:
    policy: never
- id: permission
  config:
    defaultPreset: workspace-write
    presets:
      workspace-write:
        sandbox: workspace-write
        approval: never
        name: Isolated case
        description: Read and write this diagram case
- id: session-title-llm
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-web
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-plugin-manager
  disabled: true
